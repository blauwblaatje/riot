# docker compose up -d   then open http://localhost:4201
# Namespaces and logs (riot.log, and <id>.log per namespace) are in the riot-data volume.
services:
  riot:
    build: .
    image: riot:latest
    ports:
      - "4201:4201"
    volumes:
      - riot-data:/data
    restart: unless-stopped
volumes:
  riot-data:
