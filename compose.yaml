# docker compose up -d   then open http://localhost:4201
# Namespaces and logs (rats.log, and <id>.log per namespace) are in the rats-data volume.
services:
  rats:
    build: .
    image: rats:latest
    ports:
      - "4201:4201"
    volumes:
      - rats-data:/data
    restart: unless-stopped
volumes:
  rats-data:
