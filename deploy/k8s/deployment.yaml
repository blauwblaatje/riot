apiVersion: apps/v1
kind: Deployment
metadata:
  name: riot
  labels: {app: riot}
spec:
  replicas: 1 # namespaces are kept on one volume (ReadWriteOnce)
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: riot}
  template:
    metadata:
      labels: {app: riot}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: riot
          image: riot
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 4201}
          env:
            - {name: RIOT_ADDR, value: ":4201"}
            - {name: RIOT_DATA, value: /data}
            - {name: RIOT_LOGS, value: /data/logs} # riot.log, and <id>.log per namespace
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi} # a namespace in use is held in memory
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: riot-data}
        - name: tmp
          emptyDir: {}
