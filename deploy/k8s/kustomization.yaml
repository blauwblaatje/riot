# kubectl apply -k deploy/k8s   (k3s: Traefik ingress, local-path storage)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: riot
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: riot
    newName: ghcr.io/blauwblaatje/riot # or riot for an image loaded with make k3s-import (newTag: latest)
    newTag: 0.1.1 # a release: git tag v0.1.1
