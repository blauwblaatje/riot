# kubectl apply -k deploy/k8s   (k3s: Traefik ingress, local-path storage)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rats
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: rats
    newName: rats # e.g. ghcr.io/<you>/rats, or a local image imported with: k3s ctr images import rats.tar
    newTag: latest
