# kubectl apply -k deploy/k8s   (k3s: Traefik ingress, local-path storage)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: riot
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: riot
    newName: riot # e.g. ghcr.io/<you>/riot, or a local image imported with: k3s ctr images import riot.tar
    newTag: latest
